<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bulls & Cows</title>
  <link href='https://fonts.googleapis.com/css?family=PT+Mono' rel='stylesheet' type='text/css'>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="/src/cow.png" type="image/x-icon">
</head>
<body>
  <form name="puzzle">
    <input tabindex="1" autocomplete="off" name="guess" type="text" value="" autofocus>
    <button tabindex="2" type="submit" name="check">Check</button>
    <ul class="output" id="output">
    </ul>
  </form>
  <div class="sidebar">
    <label class="input">
      <span class="input-label">Number of digits</span>
      <input class="input-control" tabindex="3" name="number" type="number" min="3" max="8" value="4">
    </label>
    <label class="input">
      <span class="input-label">Available symbols</span>
      <input class="input-control" tabindex="4" name="base" type="text" pattern="^[0-9a-zA-Z]{4,}$" value="0123456789">
    </label>
  </div>
  <script src="script.js"></script>
  <script>Game(document.forms.settings, document.forms.puzzle);</script>
</body>
</html>
